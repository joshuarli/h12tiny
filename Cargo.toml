[package]
name = "h12tiny"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A small futures-lite HTTP/1.1 and HTTP/2 endpoint layer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hyperium/h12tiny"
keywords = ["http", "async", "futures", "http2"]
categories = ["asynchronous", "network-programming", "web-programming::http-client", "web-programming::http-server"]

[features]
# Keep the default build useful while allowing protocol and endpoint surfaces to
# be checked independently.  The protocol features only turn on Hyper's
# corresponding parser/state machine; endpoint features own transport modules.
default = ["client", "server", "http1", "http2", "tls"]

client = ["dep:async-net", "hyper/client"]
server = ["dep:async-net", "hyper/server"]
http1 = ["hyper/http1"]
http2 = ["hyper/http2"]
tls = ["dep:futures-rustls", "dep:rustls", "dep:webpki-roots"]

[dependencies]
# Protocol and message types are shared by all feature combinations.  Hyper is
# always present for its runtime-neutral traits; http1/http2 select its protocol
# machinery independently.
bytes = "1"
futures-channel = "0.3"
futures-io = "0.3"
futures-lite = { version = "2", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["async-await", "std"] }
http = "1"
http-body = "1"
hyper = { package = "hyper", version = "1.11", path = "../hyper-futures-lite", default-features = false }
pin-project-lite = "0.2"

# async-net is the only socket/DNS surface.  Keeping it behind endpoint
# features lets protocol-only builds compile without pulling networking code.
# Its Unix polling backend brings libc transitively; h12tiny does not depend on
# libc directly (the dependency check documents this unavoidable platform edge).
async-io = "2"
async-net = { version = "2", optional = true }

# TLS is rustls-only.  Ring keeps the crypto provider explicit and avoids
# enabling rustls's default AWS-LC dependency graph.
futures-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "0.26", optional = true }

[dev-dependencies]
# Tests may use smol as an executor, but it is intentionally not part of the
# production graph.
smol = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(h12tiny_unstable)"] }
