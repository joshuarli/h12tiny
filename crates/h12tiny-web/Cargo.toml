[package]
name = "h12tiny-web"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Small application routing adapter for h12tiny"
license = "MIT OR Apache-2.0"

[features]
default = []
json = ["h12tiny-util/json", "dep:serde", "dep:serde_json"]
query = ["dep:serde", "dep:serde_urlencoded"]
sse = []
cors = []
upgrade = ["dep:h12tiny-server", "h12tiny-server/upgrade"]

[dependencies]
async-io = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
h12tiny-server = { path = "../h12tiny-server", default-features = false, optional = true }
h12tiny-util = { path = "../h12tiny-util", default-features = false }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = "0.1"
hyper = { workspace = true }
matchit = "0.8"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
serde_urlencoded = { version = "0.7", optional = true }

[dev-dependencies]
futures-lite = { workspace = true }
